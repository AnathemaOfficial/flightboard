<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src '__SCRIPT_HASH__'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
<meta name="referrer" content="no-referrer">
<meta name="flightboard-advisor-token" content="__FLIGHTBOARD_ADVISOR_TOKEN__">
<title>flightboard</title>
<style>
:root{--ink:#15171c;--muted:#596070;--line:#dde2ea;--paper:#f5f6f8;--card:#fff;--soft:#eef1f5;--accent:#7fe3ff;--link:#075e78;
--done:#008300;--review:#6250d6;--progress:#eda100;--ready:#2a78d6;--blocked:#e34948;--planned:#b9c0cc;--dropped:#9aa1ad;
--good:#006300;--bad:#c62f2f;--grid:#e8ebf0;--axis:#c3c8d2;--hot:#e6efff;--hot-ink:#173f7a;
font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;color:var(--ink);background:var(--paper)}
@media(prefers-color-scheme:dark){:root{--ink:#e7eaf0;--muted:#a3abb9;--line:#2c323d;--paper:#12151a;--card:#1a1e25;--soft:#232833;--link:#8fdcf3;
--review:#9085e9;--progress:#c98500;--ready:#3987e5;--blocked:#e66767;--planned:#5d6676;--good:#0ca30c;--bad:#ff8a8a;--grid:#252b35;--axis:#3a414d;--hot:#1f3352;--hot-ink:#cfe0ff}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper)}
header{background:linear-gradient(120deg,#07090d,#141b26);color:#fff;padding:20px max(24px,calc((100vw - 1260px)/2));display:flex;align-items:center;gap:18px 22px;flex-wrap:wrap}
.mark{font-weight:800;font-size:22px;letter-spacing:.5px;border:2px solid var(--accent);border-radius:12px;padding:12px 14px;color:#fff;white-space:nowrap}
.mark span,.accent{color:var(--accent)}h1{font-size:24px;margin:0 0 6px;overflow-wrap:anywhere}.head-text{flex:1 1 420px;min-width:0}
.resume{color:#f2f5fa;margin:0 0 4px;line-height:1.5;font-size:16px}.snapshot{color:#aeb8c8;margin:0;line-height:1.5;font-size:13px;overflow-wrap:anywhere}
.live{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 15px;font-size:14px;color:#eef2f8;white-space:nowrap}
.live .beacon{width:10px;height:10px;border-radius:50%;background:#3ddc84;flex:none}
.live.on .beacon{animation:pulse 2s infinite}.live.snapshot .beacon{background:#9aa1ad}.live.lost .beacon,.live.failed .beacon{background:#ff6b6b}
.live.loading .beacon{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media(prefers-reduced-motion:reduce){.live.on .beacon{animation:none}*{transition:none!important}}
main{max-width:1308px;margin:auto;padding:18px 24px 60px}h2{font-size:19px;margin:28px 0 10px}h3{margin:0;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.banner{background:#fde7e7;color:#7a1717;border-radius:8px;padding:12px 14px;margin:0 0 14px;line-height:1.5}
@media(prefers-color-scheme:dark){.banner{background:#4a2224;color:#ffd5d5}}
.banner.loading{background:var(--soft);color:var(--ink)}
.lead{color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.5}
.waiting{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.wait{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--edge,var(--ready));border-radius:8px;padding:10px 13px;line-height:1.5;font-size:15px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.wait b{white-space:nowrap}.wait .since{color:var(--muted);font-size:13px;margin-left:auto}
.k-merge{--edge:var(--done)}.k-conflict,.k-alert{--edge:var(--blocked)}.k-check,.k-tracking{--edge:var(--review)}.k-review{--edge:var(--progress)}.k-session{--edge:var(--planned)}
.pointer{color:var(--muted);font-size:13px;margin:8px 0 0}
.publication-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.publication-cards .value{font-size:22px}.publication-queue{list-style:none;padding:0;display:grid;gap:7px}
.publication-queue li{overflow-wrap:anywhere}.publication-queue a{color:var(--link)}
.overview-status{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ready);border-radius:10px;padding:13px 16px;margin:0 0 12px;line-height:1.5}
.overview-status strong{font-size:18px}.overview-status p{font-size:13px;color:var(--muted);margin:4px 0 0}
.overview-status.partial{border-left-color:var(--blocked)}.overview-status.attention{border-left-color:var(--progress)}.overview-status.clear{border-left-color:var(--done)}
.overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.overview-grid .tile{gap:9px}.overview-grid p{margin:0;overflow-wrap:anywhere}
.overview-progress-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px}.overview-progress-row .sub{grid-column:1/-1}
.prepared{margin:12px 0 18px;padding:12px 15px;background:var(--card);border:1px solid var(--line);border-radius:10px}.prepared>summary{font-weight:650}.prepared .lead{margin:9px 0}
.prepared-action{padding:9px 0;border-top:1px solid var(--line);font-size:14px}.prepared-action>summary{color:var(--link)}.prepared-action p{overflow-wrap:anywhere}
.prepared-action textarea{display:block;width:100%;resize:vertical;max-height:22rem;min-height:8rem;margin:8px 0;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace}
.prepared-action button{font:inherit;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}.copy-status{font-size:13px;color:var(--muted);margin-left:9px}
.advisor{margin:20px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}.advisor>summary{font-size:18px;font-weight:650}
.advisor fieldset{border:0;padding:0;margin:12px 0;min-width:0}.advisor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.advisor label{display:block;font-size:14px;line-height:1.5}
.advisor input:not([type=checkbox]),.advisor select,.advisor textarea{display:block;width:100%;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;margin:4px 0 0}
.advisor textarea{resize:vertical;min-height:5rem;font:13px/1.5 ui-monospace,Consolas,monospace}.advisor textarea[readonly]{min-height:14rem;max-height:32rem}.advisor .advisor-check{display:flex;align-items:flex-start;gap:8px;margin:10px 0}.advisor input[type=checkbox]{flex:none;margin-top:4px}
.advisor button{font:inherit;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}.advisor button:disabled{opacity:.55;cursor:default}.advisor .advisor-buttons{display:flex;gap:10px;flex-wrap:wrap}.advisor pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,Consolas,monospace}.advisor .advisor-status{margin:12px 0;font-size:14px;line-height:1.5}.advisor .lead{margin-top:12px}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px}
.session{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--act,var(--planned));border-radius:10px;padding:13px 15px;display:grid;gap:8px;align-content:start;min-width:0}
.act-active{--act:var(--done)}.act-recent{--act:var(--ready)}.act-quiet,.act-unknown{--act:var(--planned)}
.c-title{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}.c-sub,.c-meta,.c-last{font-size:13px;color:var(--muted);margin:0;line-height:1.5;overflow-wrap:anywhere}
.c-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.observed-dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3px 10px;margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.observed-dates dt,.observed-dates dd{margin:0;overflow-wrap:anywhere}.observed-dates dd{text-align:right}
.tracking-note{font-size:13px;line-height:1.5;padding:8px 10px;background:var(--soft);border-radius:6px;margin:6px 0 0}
.tracking-note.check{border-left:3px solid var(--review)}.tracking-note strong{display:block}
.tracking-partial{display:block;margin-top:6px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 9px;background:var(--soft);white-space:nowrap}
.badge{font-size:12px;border-radius:4px;padding:2px 7px;background:var(--soft);color:var(--ink);white-space:nowrap}
.badge.hot{background:var(--hot);color:var(--hot-ink);font-weight:600}.badge.warn{background:#fff2d6;color:#6b4500}
@media(prefers-color-scheme:dark){.badge.warn{background:#4a3a14;color:#ffe2a6}}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.move{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 9px;font-size:14px;line-height:1.4}
.trans{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--muted);font-size:13px}
.tid{font:inherit;font-weight:700;white-space:nowrap;background:none;border:0;padding:0;color:var(--link);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.tid-plain{font-weight:700;white-space:nowrap}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--c,var(--planned));flex:none}
.st-done{--c:var(--done)}.st-awaiting_review{--c:var(--review)}.st-in_progress{--c:var(--progress)}.st-ready{--c:var(--ready)}.st-blocked{--c:var(--blocked)}.st-planned{--c:var(--planned)}.st-dropped{--c:var(--dropped)}
.quiet{color:var(--muted);font-size:14px;margin:0;line-height:1.5}.warn-text{color:var(--bad);font-size:13px;margin:0;line-height:1.45}
code{background:var(--soft);border-radius:3px;padding:1px 4px;overflow-wrap:anywhere;font-size:.92em}
details>summary{cursor:pointer}details.more summary{font-size:13px;color:var(--link)}details.more ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5;color:var(--muted)}
.ended{margin-top:12px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:11px 15px}.ended ul{margin:8px 0 0;padding-left:18px;line-height:1.6;font-size:14px}
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}.split.single{grid-template-columns:1fr}.panel{display:grid;gap:7px;align-content:start}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;line-height:1.45;font-size:14px}.item p{margin:2px 0 0;color:var(--muted);font-size:13px}
.empty{padding:16px;background:var(--card);border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted);margin:0}
.events{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.event{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:14px;line-height:1.45}
.event time{color:var(--muted);font-size:13px}.event .where{color:var(--muted);font-size:13px}.new-tag{font-size:11px;font-weight:700;color:var(--hot-ink);background:var(--hot);border-radius:3px;padding:1px 5px;margin-left:6px}
.kpis{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(3,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .label{font-size:13px;color:var(--muted);font-weight:600}.tile .value{font-size:30px;font-weight:650;line-height:1.15}.tile.hero .value{font-size:48px}.tile .sub{font-size:13px;color:var(--muted);line-height:1.45}
.meter{height:8px;border-radius:4px;background:var(--soft);display:flex;gap:2px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%}
.ahead{color:var(--good);font-weight:600}.late{color:var(--bad);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.charts .wide{grid-column:1/-1}
.chart{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;gap:8px;min-width:0;align-content:start}
.chart figcaption{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}.chart figcaption p{margin:0;flex-basis:100%;font-size:13px;color:var(--muted);line-height:1.45}.plot{min-width:0;display:grid;gap:8px;align-content:start}
.toggle{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.toggle button{font:inherit;font-size:12px;border:0;background:var(--card);color:var(--muted);padding:4px 10px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:650}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-size:12px;fill:var(--muted);font-family:inherit}svg text.ink{fill:var(--ink)}svg text.strong{fill:var(--ink);font-weight:650}
svg .grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}svg .axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
svg .hit{fill:transparent}svg .hit:focus{outline:none}svg .hit:focus-visible{stroke:var(--link);stroke-width:2}svg .mark:hover,svg .mark:focus-visible{filter:brightness(1.15)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend .key{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:-2px;margin-right:5px}
.legend .key.line{height:2px;width:14px;border-radius:1px;vertical-align:3px}.legend .key.dash{height:0;width:14px;border-top:2px dashed var(--c);background:none;vertical-align:3px}.legend .key.light{opacity:.45}
.table-view summary{font-size:13px;color:var(--link)}.table-view{overflow-x:auto}
.table-view table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.table-view th,.table-view td{text-align:left;padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap}.table-view th{color:var(--muted);font-weight:600}
.tooltip{position:fixed;z-index:10;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:8px 11px;font-size:13px;line-height:1.5;max-width:330px}
.tooltip .tt-head{color:var(--muted);font-size:12px}.tooltip .row{display:flex;align-items:center;gap:7px}.tooltip .lk{width:12px;height:2px;background:var(--c);flex:none}.tooltip b{font-size:14px}.tooltip .wrap{overflow-wrap:anywhere}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:min(620px,calc(100vw - 32px));padding:18px 20px;line-height:1.5}
dialog::backdrop{background:rgba(5,8,12,.55)}dialog h3{font-size:17px;margin:0 0 4px}dialog ul{padding-left:18px;margin:4px 0 10px}dialog .close{float:right;font:inherit;background:var(--soft);border:0;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
dialog h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 2px}
.fade{transition:opacity .3s}.stale .fade{opacity:.55}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{margin-top:30px;font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .hero{grid-column:1/-1}}
@media(max-width:1000px){.charts,.split,.overview-grid,.advisor-grid{grid-template-columns:1fr}}
@media(max-width:640px){.live,.badge,.pill{white-space:normal;min-width:0}header{padding:16px;gap:12px}.mark{font-size:16px;padding:8px}h1{font-size:20px}.resume{font-size:15px}main{padding:16px 16px 48px}
.sessions{grid-template-columns:1fr}.tile.hero .value{font-size:40px}.event{grid-template-columns:1fr;gap:2px}.wait b{white-space:normal;overflow-wrap:anywhere;min-width:0}.wait .since{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">flight<span>board</span></div>
  <div class="head-text"><h1><span id="repo"></span> <span class="accent" id="mode"></span></h1><p class="resume" id="resume"></p><p class="snapshot" id="snapshot"></p><p class="snapshot" id="reading"></p></div>
  <div class="live snapshot" id="live"><span class="beacon" aria-hidden="true"></span><span id="live-text"></span></div>
  <p class="sr" role="status" id="live-state"></p>
</header>
<main>
  <div id="banner"></div>
  <section id="overview" class="fade" aria-labelledby="h-overview" hidden>
    <h2 id="h-overview" class="sr" data-t="page.overview"></h2>
    <div id="overview-banner" role="status"></div>
    <div class="overview-grid"><div class="tile" id="overview-progress"></div><div class="tile" id="overview-evidence"></div></div>
    <details class="prepared" data-key="prepared-actions" open>
      <summary data-t="page.overview_actions"></summary><p class="lead" data-t="page.overview_actions_note"></p>
      <div id="prepared-actions"></div>
    </details>
  </section>
  <details id="advisor" class="advisor" hidden>
    <summary data-t="page.advisor_title"></summary>
    <p class="lead" data-t="page.advisor_intro"></p>
    <fieldset id="advisor-config">
      <legend class="sr" data-t="page.advisor_config"></legend>
      <div class="advisor-grid">
        <label><span data-t="page.advisor_protocol"></span><select id="advisor-protocol"><option value="openai">OpenAI compatible</option><option value="anthropic">Anthropic Messages</option><option value="gemini">Gemini</option></select></label>
        <label><span data-t="page.advisor_endpoint"></span><input id="advisor-endpoint" type="url" maxlength="300" autocomplete="off" spellcheck="false"></label>
        <label><span data-t="page.advisor_model"></span><input id="advisor-model" type="text" maxlength="120" autocomplete="off" spellcheck="false"></label>
        <label><span data-t="page.advisor_output_limit"></span><input id="advisor-max-output" type="number" min="128" max="4096" value="1024" step="1"></label>
      </div>
      <p class="pointer" data-t="page.advisor_provider_note"></p>
      <label><span data-t="page.advisor_question"></span><textarea id="advisor-question" maxlength="4000" rows="3"></textarea></label>
      <div class="advisor-grid">
        <label><span data-t="page.advisor_repo_files"></span><textarea id="advisor-repo-files" maxlength="12000" rows="3" spellcheck="false"></textarea></label>
        <label><span data-t="page.advisor_local_files"></span><textarea id="advisor-local-files" maxlength="12000" rows="3" spellcheck="false"></textarea></label>
      </div>
      <p class="pointer" data-t="page.advisor_files_note"></p>
      <label class="advisor-check"><input id="advisor-consent-board" type="checkbox"><span data-t="page.advisor_consent_board"></span></label>
      <label class="advisor-check"><input id="advisor-consent-repo" type="checkbox"><span data-t="page.advisor_consent_repo"></span></label>
      <label class="advisor-check"><input id="advisor-consent-local" type="checkbox"><span data-t="page.advisor_consent_local"></span></label>
    </fieldset>
    <div class="advisor-buttons"><button id="advisor-prepare" type="button" disabled data-t="page.advisor_prepare"></button><button id="advisor-revoke" type="button" data-t="page.advisor_revoke"></button></div>
    <p id="advisor-status" class="advisor-status" role="status" aria-live="polite"></p>
    <p id="advisor-authorized-scope" class="lead" hidden></p>
    <div id="advisor-preview-section" hidden>
      <h3 data-t="page.advisor_preview_title"></h3><p id="advisor-preview-meta" class="lead"></p>
      <label><span data-t="page.advisor_preview_label"></span><textarea id="advisor-preview" readonly rows="14" spellcheck="false"></textarea></label>
      <p class="pointer" data-t="page.advisor_preview_note"></p>
      <label class="advisor-check"><input id="advisor-consent-send" type="checkbox"><span id="advisor-share-label"></span></label>
      <label><span data-t="page.advisor_key"></span><input id="advisor-key" type="password" maxlength="4096" autocomplete="off" spellcheck="false"></label>
      <p class="pointer" data-t="page.advisor_key_note"></p>
      <button id="advisor-send" type="button" disabled data-t="page.advisor_send"></button>
      <fieldset id="advisor-automatic-options"><legend data-t="page.advisor_automatic_title"></legend>
        <div class="advisor-grid">
          <label><span data-t="page.advisor_interval"></span><input id="advisor-interval" type="number" min="15" max="1440" value="60" step="1"></label>
          <label><span data-t="page.advisor_max_calls"></span><input id="advisor-max-calls" type="number" min="1" max="20" value="4" step="1"></label>
        </div>
        <label class="advisor-check"><input id="advisor-consent-automatic" type="checkbox"><span data-t="page.advisor_consent_automatic"></span></label>
        <p class="pointer" data-t="page.advisor_automatic_note"></p>
        <button id="advisor-automate" type="button" disabled data-t="page.advisor_automate"></button>
      </fieldset>
    </div>

    $('advisor-result-section').hidden = true;
    $('advisor-result').textContent = '';
    $('advisor-status').textContent = t(advisor.reloadRequired ? 'page.advisor_reload_required' : 'page.advisor_prepare_again');
    advisorControls();
  }
  function advisorReloadRequired() {
    advisor.reloadRequired = true;
    clearTimeout(advisor.timer);
    advisor.running = false;
    advisor.uncertain = false;
    advisor.automatic = null;
    advisor.job = '';
    for (const id of ['advisor-consent-board','advisor-consent-repo','advisor-consent-local']) $(id).checked = false;
    $('advisor-authorized-scope').textContent = '';
    $('advisor-authorized-scope').hidden = true;
    advisorInvalidate();  // also invalidate late responses from the previous server session
  }
  async function advisorRequest(path, body) {
    if (advisor.reloadRequired || !advisorPaths.includes(path)) throw new Error('advisor route');
    const controller = new AbortController();
    const deadline = setTimeout(() => controller.abort(), 20000);
    try {
      const headers = {'X-Flightboard-Advisor':advisorToken()};
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {method:body === undefined ? 'GET' : 'POST', headers,
        ...(body === undefined ? {} : {body:JSON.stringify(body)}), cache:'no-store', credentials:'same-origin',
        redirect:'error', signal:controller.signal});
      if (response.status === 403) {
        advisorReloadRequired();
        throw new Error('advisor authorization expired');
      }
      const value = await response.json();
      if (!response.ok || !value || typeof value !== 'object') throw new Error('advisor request');
      return value;
    } finally { clearTimeout(deadline); }
  }
  async function advisorPrepare(event) {
    if (!event.isTrusted || $('advisor-prepare').disabled) return;
    advisorInvalidate();
    const revision = advisor.revision;
    advisor.busy = true;
    advisorControls();
    $('advisor-status').textContent = t('page.advisor_preparing');
    try {
      const value = await advisorRequest('advisor/preview', {
        config:{protocol:$('advisor-protocol').value,endpoint:$('advisor-endpoint').value.trim(),
          model:$('advisor-model').value.trim(),max_output_tokens:Number($('advisor-max-output').value)},
        question:$('advisor-question').value.trim(),repo_files:advisorLines('advisor-repo-files'),
        local_files:advisorLines('advisor-local-files'),consent_board:$('advisor-consent-board').checked,
        consent_repo:$('advisor-consent-repo').checked,consent_local:$('advisor-consent-local').checked});
      if (revision !== advisor.revision) return;
      const preview = value.preview;
      if (value.state !== 'prepared' || !preview || typeof preview.id !== 'string'
          || typeof preview.sha256 !== 'string' || !preview.config || !preview.context) throw new Error('advisor preview');
      advisor.preview = preview;
      $('advisor-preview').value = JSON.stringify({question:preview.question,context:preview.context}, null, 2);
      $('advisor-preview-meta').textContent = t('page.advisor_preview_meta', {
        model:preview.config.model,endpoint:preview.config.endpoint,bytes:preview.bytes,
        at:stamp(preview.created_at),expires:stamp(preview.expires_at),hash:preview.sha256});
      $('advisor-share-label').textContent = t('page.advisor_consent_send', {
        protocol:preview.config.protocol,model:preview.config.model,endpoint:preview.config.endpoint});
      $('advisor-preview-section').hidden = false;
      $('advisor-status').textContent = t('page.advisor_prepared');
    } catch (error) {
      if (revision === advisor.revision) $('advisor-status').textContent = t('page.advisor_request_failed');
    } finally {
      advisor.busy = false;
      advisorControls();
    }
  }
  function advisorSchedule(delay) {
    clearTimeout(advisor.timer);
    if (!advisor.reloadRequired && !document.hidden && (advisor.running || advisor.uncertain || advisor.automatic?.enabled)) advisor.timer = setTimeout(advisorPoll, delay);
  }
  function advisorResult(value) {
    if (!value.result || typeof value.result.text !== 'string') return;
    $('advisor-result').textContent = value.result.text;
    const usage = value.result.usage || {};
    const tokens = number => Number.isInteger(number) && number >= 0 ? String(number) : t('page.advisor_unknown');
    $('advisor-result-meta').textContent = t('page.advisor_usage', {input:tokens(usage.input_tokens),
      output:tokens(usage.output_tokens),seconds:Number.isFinite(value.result.elapsed_seconds) ? value.result.elapsed_seconds : '—'});
    $('advisor-result-section').hidden = false;
  }
  function advisorStatus(value) {
    if (!['disabled','prepared','running','complete','error','revoked','expired'].includes(value.state)) throw new Error('advisor status');
    advisor.uncertain = false;
    advisor.running = value.state === 'running';
    advisor.automatic = value.automatic && typeof value.automatic === 'object' ? value.automatic : null;
    if (['disabled','revoked','expired'].includes(value.state)) {
      advisor.preview = null;
      $('advisor-consent-send').checked = false;
      $('advisor-consent-automatic').checked = false;
      $('advisor-key').value = '';
      $('advisor-preview-section').hidden = true;
      $('advisor-result').textContent = '';
      $('advisor-result-section').hidden = true;
    }
    const authorization = value.authorization;
    if (advisor.automatic?.enabled && authorization && authorization.config
        && typeof authorization.question === 'string' && Array.isArray(authorization.repo_files)
        && Array.isArray(authorization.local_files)) {
      const config = authorization.config;
      $('advisor-protocol').value = config.protocol;
      $('advisor-endpoint').value = config.endpoint;
      $('advisor-model').value = config.model;
      $('advisor-max-output').value = String(config.max_output_tokens);
      $('advisor-question').value = authorization.question;
      $('advisor-repo-files').value = authorization.repo_files.join('\n');
      $('advisor-local-files').value = authorization.local_files.join('\n');
      $('advisor-interval').value = String(advisor.automatic.interval_minutes);
      $('advisor-max-calls').value = String(advisor.automatic.max_calls);
      $('advisor-consent-board').checked = true;
      $('advisor-consent-repo').checked = authorization.repo_files.length > 0;
      $('advisor-consent-local').checked = authorization.local_files.length > 0;
      $('advisor-authorized-scope').textContent = t('page.advisor_authorized_scope', {
        protocol:config.protocol,endpoint:config.endpoint,model:config.model,
        repo:authorization.repo_files.join(', ') || '—',local:authorization.local_files.join(', ') || '—'});
      $('advisor-authorized-scope').hidden = false;
    } else if (!advisor.automatic?.enabled) {
      $('advisor-authorized-scope').textContent = '';
      $('advisor-authorized-scope').hidden = true;
    }
    advisorResult(value);
    $('advisor-status').textContent = advisor.automatic?.enabled
      ? t('page.advisor_automatic_status', {used:advisor.automatic.used,max:advisor.automatic.max_calls,
        remaining:advisor.automatic.remaining,next:stamp(advisor.automatic.next_check_at),expires:stamp(advisor.automatic.expires_at)})
        + (value.state === 'error' && value.error !== 'automatic_context_unavailable' ? ' ' + t('page.advisor_state_error') : '')
      : value.error === 'automatic_context_unavailable' ? '' : t('page.advisor_state_' + value.state);
    if (advisor.automatic && !advisor.automatic.enabled && Number.isInteger(advisor.automatic.max_calls)) {
      $('advisor-status').textContent += ' ' + t('page.advisor_automatic_finished', {
        used:advisor.automatic.used,max:advisor.automatic.max_calls});
    }
    if (value.error === 'automatic_context_unavailable') {
      $('advisor-status').textContent += ' ' + t('page.advisor_automatic_context_unavailable');
    }
    advisorControls();
  }
  async function advisorPoll(force = false) {
    if (advisor.reloadRequired || advisor.checking || document.hidden || (!force && !advisor.running && !advisor.uncertain && !advisor.automatic?.enabled)) return;
    const revision = advisor.revision;
    if (force) advisor.uncertain = true;
    advisor.checking = true;
    advisorControls();
    try {
      const value = await advisorRequest('advisor/status');
      if (revision !== advisor.revision) return;
      advisorStatus(value);
      advisorSchedule(advisor.running ? 2000 : 30000);
    } catch (error) {
      if (revision !== advisor.revision) return;
      $('advisor-status').textContent = t('page.advisor_status_failed');
      advisorSchedule(30000);
    } finally { advisor.checking = false; advisorControls(); }
  }
  async function advisorSend(event, automatic = false) {
    if (!event.isTrusted || $(automatic ? 'advisor-automate' : 'advisor-send').disabled || !advisor.preview) return;
    const revision = ++advisor.revision, preview = advisor.preview;
    advisor.preview = null;  // the server consumes a preview once; uncertain delivery must not make it reusable
    advisor.busy = true;
    advisorControls();
    const request = {preview_id:preview.id,sha256:preview.sha256,consent_send:$('advisor-consent-send').checked,
      api_key:$('advisor-key').value};
    if (automatic) Object.assign(request, {consent_automatic:$('advisor-consent-automatic').checked,
      interval_minutes:Number($('advisor-interval').value),max_calls:Number($('advisor-max-calls').value)});
    $('advisor-key').value = '';
    $('advisor-consent-send').checked = false;
    $('advisor-consent-automatic').checked = false;
    $('advisor-status').textContent = t('page.advisor_state_running');
    try {
      const value = await advisorRequest(automatic ? 'advisor/automate' : 'advisor/analyze', request);
      request.api_key = '';
      if (revision !== advisor.revision) return;
      advisor.job = typeof value.job_id === 'string' ? value.job_id : '';
      advisorStatus({...value,automatic:value.automatic || (automatic ? {enabled:true} : null)});
      advisorSchedule(2000);
    } catch (error) {
      request.api_key = '';
      if (revision === advisor.revision) {
        advisor.uncertain = true;
        $('advisor-status').textContent = t('page.advisor_send_uncertain');
        advisorSchedule(0);  // reconcile only status; never repeat a potentially accepted provider request
      }
    } finally {
      advisor.busy = false;
      advisorControls();
    }
  }
  async function advisorRevoke(event) {
    if (!event.isTrusted || advisor.reloadRequired || advisor.revoking) return;
    clearTimeout(advisor.timer);
    advisor.running = false;
    advisor.uncertain = false;
    advisor.automatic = null;
    advisor.revoking = true;
    advisorInvalidate();
    $('advisor-authorized-scope').textContent = '';
    $('advisor-authorized-scope').hidden = true;
    const revision = advisor.revision;
    try {
      await advisorRequest('advisor/revoke', {});
      if (revision === advisor.revision) $('advisor-status').textContent = t('page.advisor_state_revoked');
    } catch (error) {
      if (revision === advisor.revision) {
        $('advisor-status').textContent = t('page.advisor_revoke_failed');
        advisor.uncertain = true;  // do not present a failed revocation as confirmation that the backend stopped
        advisorSchedule(30000);
      }
    } finally {
      advisor.revoking = false;
      advisorControls();
    }
  }
  function advisorInit() {
    const token = advisorToken();
    if (!polling || !token || token.includes('__FLIGHTBOARD_')) return;
    $('advisor').hidden = false;
    const endpoint = protocol => ({openai:'https://api.openai.com/v1',anthropic:'https://api.anthropic.com/v1',
      gemini:'https://generativelanguage.googleapis.com/v1beta'})[protocol] || '';
    $('advisor-endpoint').value = endpoint($('advisor-protocol').value);
    $('advisor-question').value = t('page.advisor_default_question');
    $('advisor-status').textContent = t('page.advisor_state_unchecked');
    $('advisor').addEventListener('toggle', () => $('advisor').open ? advisorPoll(true) : undefined);
    for (const id of advisorFields) $(id).addEventListener('input', advisorInvalidate);
    $('advisor-protocol').addEventListener('change', () => {
      $('advisor-endpoint').value = endpoint($('advisor-protocol').value);
      advisorInvalidate();
    });
    for (const id of ['advisor-consent-send','advisor-consent-automatic','advisor-interval','advisor-max-calls']) {
      $(id).addEventListener('input', advisorControls);
    }
    $('advisor-prepare').addEventListener('click', advisorPrepare);
    $('advisor-send').addEventListener('click', event => advisorSend(event));
    $('advisor-automate').addEventListener('click', event => advisorSend(event, true));
    $('advisor-revoke').addEventListener('click', advisorRevoke);
    document.addEventListener('visibilitychange', () => { clearTimeout(advisor.timer); if (!document.hidden) advisorSchedule(0); });
    window.addEventListener('pagehide', () => { $('advisor-key').value = ''; clearTimeout(advisor.timer); });
    advisorControls();
  }
  // ---- end optional advisor

  // ---- live: read again; an error or timeout cannot leave old session verdicts looking current
  function requestTimeout() {
    const seconds = own(own(data, 'settings'), 'read_seconds');
    return ((Number.isInteger(seconds) && seconds >= 12 && seconds <= 120 ? seconds : 12) + 8) * 1000;
  }
  async function refresh() {
    clearTimeout(timer);
    const version = ++refreshVersion;
    if (refreshController) refreshController.abort();
    if (document.hidden) return;
    const controller = new AbortController();
    refreshController = controller;
    const deadline = setTimeout(() => controller.abort(), requestTimeout());
    if (!document.hidden) {
      try {
        const response = await fetch('state.json', {cache: 'no-store', credentials: 'same-origin', redirect: 'error', signal: controller.signal});
        if (!response.ok) throw new Error('state ' + response.status);
        const text = await response.text();
        const next = JSON.parse(text);
        if (version !== refreshVersion) return;
        if (!next || !next.main || !Array.isArray(next.sessions) || !Array.isArray(next.waiting)) throw new Error('invalid state');
        if (next.main.state === 'ok') lastOk = completedAt(next);
        const recovered = Boolean(failed) || lost;
        lost = false;
        failed = next.main.state === 'ok' || next.main.state === 'loading' ? '' : next.main.reason_text;
        data = next;  // failed readings replace old verdicts too: they are not evidence of a session's current state
        const key = keyOf(text);
        if (key !== lastKey || recovered) { lastKey = key; render(); } else renderLive();
      } catch (error) {
        if (version !== refreshVersion) return;
        lost = true;
        if (lastOk === null) {
          const reason = t('page.initial_failed');
          data = {...data, main: {...data.main, state: 'unreadable', reason_text: reason},
            sources: Array.isArray(data.sources)
              ? data.sources.map(source => ({...source, state: 'unreadable', detail: reason})) : []};
          renderHeader();
          renderFooter();
        }
        $('resume').textContent = t('page.figures_unreadable');
        put($('waiting'), h('li', {className: 'empty'}, t('page.nothing_readable')));
        put($('sessions'), h('p', {className: 'empty'}, t('page.sessions_unreadable')));
        put($('ended'));
        put($('next'), h('p', {className: 'empty'}, t('page.next_unreadable')));
        put($('events'), h('li', {className: 'empty'}, t('page.nothing_readable')));
        put($('pointer'));
        $('progress').hidden = true;
        data = {...data, publication:null, overview:null};
        renderOverview();
        renderPublication();
        if (openedTask !== null) {
          put($('task-body'), h('h3', {id: 'task-title'}, openedTask), h('p', {className: 'warn-text'}, t('page.task_unavailable')));
        }
        put($('banner'), h('p', {className: 'banner'}, lastOk === null ? t('page.initial_failed') : t('page.failed_at', {when: stamp(new Date(lastOk).toISOString()), reason: t('page.spoken_lost')})));
        renderLive();
      } finally {
        clearTimeout(deadline);
        if (version === refreshVersion) refreshController = null;
      }
    }
    if (version === refreshVersion) timer = setTimeout(refresh, Math.max(5, Number(data.refresh_seconds) || 10) * 1000);
  }
  function startPolling() {
    if (!polling) return;
    if (data.main.state === 'loading') return refresh();
    timer = setTimeout(refresh, Math.max(5, Number(data.refresh_seconds) || 10) * 1000);
  }
  let resizing = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(resizing); resizing = requestAnimationFrame(() => redraw(renderCharts)); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { remember(); clearTimeout(timer); ++refreshVersion; if (refreshController) refreshController.abort(); } else if (polling) refresh(); });
  window.addEventListener('pagehide', remember);
  setInterval(() => {
    for (const node of document.querySelectorAll('[data-ago]')) node.textContent = t(node.getAttribute('data-message') || 'page.ago', {span: span(node.getAttribute('data-ago')) || '—'});
    renderLive();
  }, 1000);
  advisorInit();
  render();
  lastKey = keyOf(JSON.stringify(data));
  startPolling();
})();
</script>
</body>
</html>
