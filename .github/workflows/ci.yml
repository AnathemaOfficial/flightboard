#
# Tests on Windows, Linux and macOS with Python 3.12 and 3.14; the plugin validated in strict mode; licensing checked
# with REUSE. Third-party actions are pinned by commit; permissions are read-only and no credential is kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: A git newer than Apple's (2.41 or later)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          git --version
          python -I -B skills/flightboard/scripts/flightboard.py --version
          python -I -B -c "import sys; sys.path.insert(0, 'skills/flightboard/scripts')
          from flightboard.gitreads import executable; print('git used:', executable())"
      - name: Tests
        run: python -I -B -m unittest discover -s tests -t .

  plugin:
    name: Plugin manifests (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the marketplace and the plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict .claude-plugin/plugin.json

  licensing:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE lint
        run: pipx run reuse==6.3.0 lint
